adb_test:
  name: Test ADB connection
  description: Test the ADB Lite connection used by ADB FullTV.
  fields:
    host:
      name: IP address
      description: Uses the TV configured in the integration when omitted.
      required: false
      selector:
        text:
adb_set_volume_test:
  name: Test ADB volume
  description: Try setting the TV volume immediately through ADB Lite.
  fields:
    host:
      name: IP address
      description: Uses the TV configured in the integration when omitted.
      required: false
      selector:
        text:
    level:
      name: Volume level
      description: A volume level from 0.0 to 1.0. For example, 0.8 is 80%.
      required: false
      default: 0.8
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
